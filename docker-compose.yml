  router:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    volumes:
    - ./infra/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      af-primary:
        condition: service_started
      af-standby:
        condition: service_started
      eu-primary:
        condition: service_started
      eu-standby:
        condition: service_started
      as-primary:
        condition: service_started
      as-standby:
        condition: service_started
      na-primary:
        condition: service_started
      na-standby:
        condition: service_started
      sa-primary:
        condition: service_started
      sa-standby:
        condition: service_started
      oc-primary:
        condition: service_started
      oc-standby:
        condition: service_started
    networks:
      mesh:
        aliases:
        - region-af
        - region-eu
        - region-as
        - region-na
        - region-sa
        - region-oc
  legacy:
    build:
      context: ./infra/legacy
      dockerfile: Dockerfile
    image: globalscale-legacy:1.0
    environment:
      INTEGRITY_KEY: ${INTEGRITY_KEY:?Falta INTEGRITY_KEY}
      CERT_PASSWORD: ${CERT_PASSWORD:?Falta CERT_PASSWORD}
    volumes:
    - certs:/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
    - mesh
  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: globalscale-bank:1.0
    restart: unless-stopped
    ports:
    - ${BIND_IP:-0.0.0.0}:8443:8443
    environment:
      PG_PASSWORD: ${PG_PASSWORD:?Execute INICIAR_WINDOWS.ps1}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Execute INICIAR_WINDOWS.ps1}
      POSTGRES_USER: globalscale
      POSTGRES_DB: globalscale
      DB_HOST: db-global
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD}
      REGIONAL_PASSWORD: ${REGIONAL_PASSWORD:?Falta REGIONAL_PASSWORD}
      TELLER_PASSWORD: ${TELLER_PASSWORD:?Falta TELLER_PASSWORD}
      BRANCH_PASSWORD: ${BRANCH_PASSWORD:?Falta BRANCH_PASSWORD}
      MANAGER_AF_PASSWORD: ${MANAGER_AF_PASSWORD:?Falta MANAGER_AF_PASSWORD}
      MANAGER_AS_PASSWORD: ${MANAGER_AS_PASSWORD:?Falta MANAGER_AS_PASSWORD}
      MANAGER_NA_PASSWORD: ${MANAGER_NA_PASSWORD:?Falta MANAGER_NA_PASSWORD}
      MANAGER_SA_PASSWORD: ${MANAGER_SA_PASSWORD:?Falta MANAGER_SA_PASSWORD}
      MANAGER_OC_PASSWORD: ${MANAGER_OC_PASSWORD:?Falta MANAGER_OC_PASSWORD}
      INTEGRITY_KEY: ${INTEGRITY_KEY:?Falta INTEGRITY_KEY}
      CONTROL_AGENT_KEY: ${CONTROL_AGENT_KEY:?Falta CONTROL_AGENT_KEY}
      FAILOVER_PAUSE_SECONDS: ${FAILOVER_PAUSE_SECONDS:-8}
    volumes:
    - certs:/certs:ro
    depends_on:
      db-global:
        condition: service_healthy
      router:
        condition: service_started
      legacy:
        condition: service_started
    networks:
    - mesh
  nfs-server:
    image: erichough/nfs-server:latest
    profiles:
    - dfs
    privileged: true
    environment:
      NFS_EXPORT_0: /exports *(rw,sync,no_subtree_check,no_root_squash)
    volumes:
    - nfs_data:/exports
    restart: unless-stopped
    networks:
    - mesh
  nfs-client:
    image: alpine:3.20
    profiles:
    - dfs
    privileged: true
    command:
    - sh
    - -c
    - apk add --no-cache nfs-utils && mkdir -p /mnt/shared && mount -t nfs -o vers=4 nfs-server:/exports /mnt/shared
      && echo "NFS client READY" && tail -f /dev/null
    depends_on:
      nfs-server:
        condition: service_started
    networks:
    - mesh
volumes:
  pg_global: {}
  pg_af: {}
  pg_eu: {}
  pg_as: {}
  pg_na: {}
  pg_sa: {}
  pg_oc: {}
  certs: {}
  nfs_data: {}
networks:
  mesh:
    driver: bridge
