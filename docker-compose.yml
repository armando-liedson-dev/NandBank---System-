name: globalscale
services:
  cert-init:
    image: globalscale-bank:1.0
    command:
    - python
    - /app/certgen.py
    environment:
      LAN_IP: ${LAN_IP:-127.0.0.1}
      CERT_PASSWORD: ${CERT_PASSWORD:?Falta CERT_PASSWORD}
    volumes:
    - certs:/certs
    restart: 'no'
    networks:
    - mesh
  db-global:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PG_PASSWORD: ${PG_PASSWORD:?Execute INICIAR_WINDOWS.ps1}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Execute INICIAR_WINDOWS.ps1}
      POSTGRES_USER: globalscale
      POSTGRES_DB: globalscale
    volumes:
    - pg_global:/var/lib/postgresql/data
    - ./infra/sql/global.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - ./infra/sql/pg-secure.sh:/docker-entrypoint-initdb.d/20-secure.sh:ro
    - certs:/certs:ro
    command:
    - postgres
    - -c
    - ssl=on
    - -c
    - ssl_cert_file=/certs/db-global.crt
    - -c
    - ssl_key_file=/certs/db-global.key
    - -c
    - max_prepared_transactions=100
    - -c
    - max_connections=85
    - -c
    - shared_buffers=32MB
    - -c
    - password_encryption=scram-sha-256
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U globalscale -d globalscale
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      cert-init:
        condition: service_completed_successfully
    networks:
    - mesh
  db-af:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
