global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 3s
  timeout client 30s
  timeout server 30s

listen africa
  bind *:9501
  mode tcp
  balance first
  server af-primary af-primary:9443 check inter 2s fall 2 rise 2
  server af-standby af-standby:9443 check inter 2s fall 2 rise 2 backup
listen europa
  bind *:9502
  mode tcp
  balance first
  server eu-primary eu-primary:9443 check inter 2s fall 2 rise 2
  server eu-standby eu-standby:9443 check inter 2s fall 2 rise 2 backup
